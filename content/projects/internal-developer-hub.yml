title: SMB Growth & CRM Strategy — Cielo Pequeno Varejo
description: Managed the full customer lifecycle for Cielo's small retail (Pequeno Varejo) segment, covering acquisition, activation, revenue growth, digital engagement, churn reduction, and NPS improvement. Developed pricing models through rigorous P&L and NPV analysis, using A/B testing (addressed base vs. control groups) to validate commercial hypotheses before broad rollout.
