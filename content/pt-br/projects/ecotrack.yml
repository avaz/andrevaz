title: GTM Strategy de R$1 Bilhão — Mercado Livre SMB
description: Desenhou e executou uma estratégia abrangente de Go-To-Market para os segmentos SMB e Long Tail do Mercado Livre, gerenciando um pipeline de R$ 1 bilhão em TPV anual. Construiu e liderou um time de mais de 50 representantes de Inside Sales em canais de televendas, funil digital e vendas consultivas com SPIN Selling e Receita Previsível.
