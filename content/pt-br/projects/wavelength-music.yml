title: Transformação Digital — Ecossistema de Parceiros Cielo
description: Liderou a transformação digital do ecossistema de parceiros da Cielo, abrangendo os canais físico e e-commerce. Realizou estudos de viabilidade, definiu escopo de MVP e End Game e avaliou business cases, custos de implantação e requisitos técnicos para cada integração de parceiro — acelerando a captura de receita digital da Cielo junto a relações de comerciantes novos e existentes.
