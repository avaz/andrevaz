title: Crescimento SMB & Estratégia de CRM — Cielo Pequeno Varejo
description: Gerenciou o ciclo de vida completo do cliente para o segmento de Pequeno Varejo da Cielo, cobrindo aquisição, ativação, revenue growth, engajamento digital, redução de churn e melhoria de NPS. Desenvolveu modelos de pricing por meio de análise rigorosa de P&L e VPL, utilizando testes A/B (base abordada vs. grupo de controle) para validar hipóteses comerciais antes de rollouts amplos.
