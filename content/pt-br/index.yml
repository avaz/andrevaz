blog:
  title: "Artigos Recentes"
  description: "Minhas reflexões sobre liderança em vendas, GTM strategy e crescimento de receita"
faq:
  title: Perguntas Frequentes
  description: Perguntas comuns sobre minha trajetória, expertise e como posso ajudar seu negócio a crescer.
  categories:
    - title: Expertise & Serviços
      questions:
        - label: Quais são suas principais áreas de expertise?
          content: |
            Minha expertise abrange estratégia e execução de Inside Sales, design de GTM (Go-To-Market) para segmentos B2B e SMB, gestão de Revenue Growth, Transformação Digital de operações comerciais, arquitetura e automação de CRM e Sales Leadership. Construí e gerenciei times de mais de 50 representantes com pipelines anuais superiores a R$ 1 bilhão.
        - label: Em quais setores você atuou?
          content: |
            Tenho profunda experiência em fintech e pagamentos digitais (Mercado Livre, Cielo), varejo (Carrefour, Cacau Show) e e-commerce. Minha expertise abrange ambientes B2B e B2C, com foco especial nos segmentos SMB e Long Tail na economia digital brasileira.
        - label: Você realiza trabalhos de consultoria?
          content: |
            Sim, estou aberto a engajamentos de consultoria estratégica focados em estruturação de Inside Sales, design de GTM strategy, otimização de processos de vendas e automação de vendas com IA. Se você busca escalar sua operação comercial ou acelerar o crescimento de receita, vamos conversar.
    - title: Liderança & Resultados
      questions:
        - label: Quais resultados você alcançou na sua carreira?
          content: |
            Destaques principais: gestão de um pipeline de vendas de R$ 1 bilhão em TPV anual no Mercado Livre; liderança de um time de mais de 50 representantes de Inside Sales; implementação de qualificação de leads por IA que reduziu o CAC em 35% sem perda de performance de conversão; e iniciativas de transformação digital na Cielo que modernizaram ecossistemas de parceiros nos canais físico e e-commerce.
        - label: Como você aborda a construção de times de vendas de alta performance?
          content: |
            Combino metodologias estruturadas (SPIN Selling, Receita Previsível) com gestão orientada a dados. Foco em definir KPIs claros, construir processos robustos de cadência via CRM, desenvolver papéis de SDR e Closer com playbooks específicos e criar uma cultura onde a performance é medida, celebrada e continuamente aprimorada.
        - label: Qual é sua abordagem para Transformação Digital em vendas?
          content: |
            Acredito que a Transformação Digital em operações comerciais deve equilibrar adoção de tecnologia com performance humana. Minha abordagem começa com o mapeamento do processo de vendas existente, identificação de oportunidades de automação de alto impacto (cadências de CRM, lead scoring por IA), pilotagem de mudanças com baselines mensuráveis e escalagem do que funciona — sempre mantendo as taxas de conversão e a experiência do cliente no centro.
    - title: Formação
      questions:
        - label: Qual é sua formação acadêmica?
          content: |
            Tenho MBA em Gestão de Negócios pela FIA (Fundação Instituto de Administração), uma das escolas de negócios mais renomadas do Brasil, e graduação em Marketing pela Pontifícia Universidade Católica de São Paulo (PUC-SP).
        - label: Onde você está localizado e trabalha remotamente?
          content: |
            Estou localizado em Santana de Parnaíba, São Paulo, Brasil. Tenho experiência em liderar operações de vendas totalmente remotas e híbridas, tendo gerenciado times distribuídos por todo o Brasil ao longo da minha carreira.
