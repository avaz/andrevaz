      name: 'Ricardo Mendes'
      description: 'VP de Operações Comerciais, Fintech Brasil'
      avatar:
        src: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=40&h=40&q=80'
        srcset: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=80&h=80&q=80 2x'
  - quote: "O que diferencia o André é sua rara combinação de visão estratégica e execução hands-on. Durante nossa atuação juntos na Cielo, ele liderou a transformação digital do ecossistema de parceiros com uma clareza e disciplina orientada a dados que poucos líderes possuem. Ele não constrói apenas times de vendas — ele constrói máquinas de receita."
    author:
      name: 'Fernanda Costa'
      description: 'Head de Canais Digitais, Cielo'
      avatar:
        src: 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=40&h=40&q=80'
        srcset: 'https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?ixlib=rb-1.2.1&auto=format&fit=facearea&facepad=2&w=80&h=80&q=80 2x'
  - quote: "O André foi fundamental na implementação da qualificação de leads por IA que melhorou dramaticamente nossa eficiência de vendas. Seu profundo conhecimento de Inside Sales, gestão de SDRs e automação de CRM — combinado com uma liderança genuína — fez dele o líder comercial de maior impacto com quem trabalhei no ecossistema de tecnologia brasileiro."
    author:
