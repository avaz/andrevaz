testimonials:
  - quote: "André tem uma capacidade excepcional de transformar desafios complexos de negócios em estratégias de vendas estruturadas e executáveis. Sua abordagem GTM no Mercado Livre estabeleceu um novo padrão para como pensamos sobre aquisição e retenção de PMEs. Os resultados falam por si — um pipeline de R$1 bilhão gerenciado com precisão e consistência."
