title: Sobre Mim
description: Conheça minha trajetória como Gerente de Vendas & Crescimento, minha carreira no Mercado Livre, Cielo e Carrefour, e minha paixão por construir operações de vendas de alta performance que geram crescimento de receita sustentável.
content: |
  Olá, sou **André Vaz**, Gerente de Vendas & Crescimento baseado em Santana de Parnaíba, São Paulo, Brasil. Nos últimos 15+ anos, dediquei minha carreira a uma coisa: transformar estratégia comercial em resultados reais e mensuráveis — construindo os times, processos e sistemas que fazem isso acontecer.

  Minha jornada começou em planejamento e estratégia comercial, evoluindo por papéis na **Cacau Show**, **Carrefour**, **Cielo** e, agora, no **Mercado Livre**, onde lidero operações de Inside Sales para os segmentos SMB e Long Tail. A cada passo, aprofundei meu entendimento sobre o que é necessário para escalar receita em mercados complexos e de alta competitividade.

  ### O Que Faço

  Sou especializado em **Inside Sales** e **GTM (Go-To-Market) Strategy** para segmentos B2B e SMB. Meu trabalho abrange o ciclo comercial completo: desde o design do modelo go-to-market e a estruturação de times de SDR e Closer, até a construção de cadências no CRM, definição de KPIs e otimização da dinâmica CAC/LTV. Gerenciei pipelines superiores a **R$ 1 bilhão** em TPV anual, liderando times de **mais de 50 representantes de vendas**.

  Uma das minhas conquistas mais expressivas é a implementação de **qualificação de leads por IA** no Mercado Livre, que reduziu o Custo de Aquisição de Clientes (CAC) em **35%** sem nenhuma perda de performance de conversão — provando que tecnologia e execução humana, quando combinadas corretamente, criam uma vantagem competitiva composta.

  ### Minha Abordagem à Liderança em Vendas

  Acredito que grandes operações de vendas são construídas sobre três pilares: **clareza de estratégia**, **rigor na execução** e **uma cultura obcecada com o aprendizado a partir dos dados**. Utilizo metodologias como SPIN Selling e Receita Previsível como frameworks, não como dogma — sempre adaptando à realidade do mercado e às dinâmicas específicas de cada segmento.

  Minha experiência abrange tanto o estratégico quanto o tático: desde a definição de modelos de pricing e análise de P&L na Cielo, até a liderança de estratégias de CRM para gestão do ciclo de vida de clientes SMB, e a orquestração da integração Omni-Channel entre forças de vendas físicas e digitais.

  ### Transformação Digital em Operações Comerciais

  Ao longo da minha carreira, liderei e participei de grandes iniciativas de **Transformação Digital** — desde a digitalização de ecossistemas de parceiros na Cielo até o deploy de automação de vendas com IA no Mercado Livre. Acredito que o futuro das vendas está na interseção entre dados, tecnologia e relações humanas excepcionais.

  ### Além do Trabalho

  Fora do mundo comercial, sou apaixonado por futebol, por explorar a vibrante cena gastronômica de São Paulo e por me manter atualizado sobre as últimas tendências em SaaS, operações de receita e aplicações de IA nos negócios. Sou também um firme defensor de que liderança é uma prática contínua — invisto regularmente em aprendizado e no desenvolvimento das pessoas ao meu redor.

  Fique à vontade para explorar meus [projetos](/pt-BR/projects), ler meus [artigos](/pt-BR/blog) ou [entrar em contato](/#contact) se quiser conectar!
