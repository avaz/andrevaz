faq:
  title: Frequently Asked Questions
  description: Common questions about my background, expertise, and how I can help your business grow.
  categories:
    - title: Expertise & Services
      questions:
        - label: What are your core areas of expertise?
          content: |
            My expertise spans Inside Sales strategy and execution, GTM (Go-To-Market) design for B2B and SMB segments, Revenue Growth management, Digital Transformation of commercial operations, CRM architecture and automation, and Sales Leadership. I've built and managed teams of 50+ representatives with annual pipelines exceeding R$ 1 billion.
        - label: What industries have you worked in?
          content: |
            I have deep experience in fintech and digital payments (Mercado Livre, Cielo), retail (Carrefour, Cacau Show), and e-commerce. My expertise spans both B2B and B2C environments, with a particular focus on SMB and Long Tail segments in Brazil's high-growth digital economy.
        - label: Do you do consulting work?
          content: |
            Yes, I am open to strategic consulting engagements focused on Inside Sales structuring, GTM strategy design, sales process optimization, and AI-driven sales automation. If you're looking to scale your commercial operation or accelerate revenue growth, let's talk.
    - title: Leadership & Results
      questions:
        - label: What results have you achieved in your career?
          content: |
            Key highlights include: managing a sales pipeline of R$ 1 billion annual TPV at Mercado Livre; leading a team of 50+ inside sales representatives; implementing AI-powered lead qualification that reduced CAC by 35% without losing conversion performance; and driving digital transformation initiatives at Cielo that modernized partner ecosystems across physical and e-commerce channels.
        - label: How do you approach building high-performance sales teams?
          content: |
            I combine structured methodologies (SPIN Selling, Predictable Revenue) with data-driven management. I focus on defining clear KPIs, building robust cadence processes through CRM, developing SDR and Closer roles with specific playbooks, and creating a culture where performance is measured, celebrated, and continuously improved.
        - label: What is your approach to Digital Transformation in sales?
          content: |
            I believe Digital Transformation in commercial operations must balance technology adoption with human performance. My approach starts with mapping the existing sales process, identifying high-impact automation opportunities (CRM cadences, AI lead scoring), piloting changes with measurable baselines, and scaling what works — always keeping conversion rates and customer experience at the center.
    - title: Background
      questions:
        - label: What is your educational background?
          content: |
            I hold an MBA in Business Management from FIA (Fundação Instituto de Administração), one of Brazil's most prestigious business schools, and a degree in Marketing from Pontifícia Universidade Católica de São Paulo (PUC-SP).
        - label: Where are you based and do you work remotely?
          content: |
            I'm based in Santana de Parnaíba, São Paulo, Brazil. I'm experienced in leading fully remote and hybrid sales operations, having managed distributed teams across Brazil throughout my career.
