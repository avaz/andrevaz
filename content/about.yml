title: About Me
description: Learn more about my journey as a Sales & Growth Manager, my career at Mercado Livre, Cielo, and Carrefour, and my passion for building high-performance sales operations that drive sustainable revenue growth.
content: |
  Hi, I'm **André Vaz**, a Sales & Growth Manager based in Santana de Parnaíba, São Paulo, Brazil. Over the past 15+ years, I've dedicated my career to one thing: turning commercial strategy into real, measurable results — building the teams, processes, and systems that make it happen.

  My journey started in commercial planning and strategy, evolving through roles at **Cacau Show**, **Carrefour**, **Cielo**, and now **Mercado Livre**, where I lead Inside Sales operations for SMB and Long Tail segments. Each step of the way, I've grown my understanding of what it takes to scale revenue in complex, high-competition markets.

  ### What I Do

  I specialize in **Inside Sales** and **GTM (Go-To-Market) Strategy** for B2B and SMB segments. My work covers the full commercial cycle: from designing the go-to-market model and structuring SDR and Closer teams, to building CRM cadences, defining KPIs, and optimizing CAC/LTV dynamics. I've managed pipelines exceeding **R$ 1 billion** in annual TPV, leading teams of **50+ sales representatives**.

  One of my proudest achievements is the implementation of **AI-powered lead qualification** at Mercado Livre, which reduced Customer Acquisition Cost (CAC) by **35%** without any loss in conversion performance — proving that technology and human execution, when combined correctly, create a compounding competitive advantage.

  ### My Approach to Sales Leadership

  I believe great sales operations are built on three pillars: **clarity of strategy**, **rigor in execution**, and **a culture obsessed with learning from data**. I use methodologies like SPIN Selling and Predictable Revenue as frameworks, not dogma — always adapting to the market reality and the specific dynamics of each segment.

  My experience spans both the strategic and the tactical: from defining pricing models and P&L analysis at Cielo, to leading CRM growth strategies for SMB lifecycle management, to orchestrating Omni-Channel integration between physical and digital sales forces.

  ### Digital Transformation in Commercial Operations

  Throughout my career, I've led and participated in major **Digital Transformation** initiatives — from digitalizing partner ecosystems at Cielo to deploying AI-driven sales automation at Mercado Livre. I believe the future of sales is at the intersection of data, technology, and exceptional human relationships.

  ### Beyond Work

  Outside of the commercial world, I'm a family person, I love my wife Jasia, we have 2 kids and the third in on its way. I spent most of my time with them when I'm not working or staying current on the latest trends in SaaS, revenue operations, and AI applications in business. I'm also a firm believer that leadership is a continuous practice — I invest regularly in learning and in the development of everyone around me.

  Feel free to explore my [case studies](/projects), read my [articles](/blog), or [get in touch](/#contact) if you'd like to connect!
